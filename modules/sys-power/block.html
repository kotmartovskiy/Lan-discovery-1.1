{% if current_user.role != 'guest' %}
<div class="card">

<h2>⚡ Управление питанием</h2>

<div class="info-row">
<button type="button" onclick="if(confirm('Перезагрузить {{ board_title }}?')){fetch('/api/reboot',{method:'POST'}).then(()=>alert('Перезагрузка...'))}">
Перезагрузить
</button>
<button type="button" onclick="powerOff()" style="background:#e74c3c;">
Выключить питание
</button>
</div>

</div>
{% endif %}
