<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>2048</title>
<style>
:root{color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0f14;color:#e6edf3;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:8px;overflow:hidden;height:100vh;user-select:none}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:6px}
.pill{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:4px 12px;font-size:13px}
.pill b{font-weight:800}
.btns{display:flex;gap:6px;margin-bottom:8px}
.btns button{background:rgba(255,255,255,.06);color:#e6edf3;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:5px 14px;font-size:12px;font-weight:700;cursor:pointer}
.btns button:hover{border-color:rgba(255,255,255,.3)}
canvas{border-radius:10px;display:block;border:1px solid rgba(255,255,255,.08);background:#bbada0;touch-action:none}
.hint{opacity:.7;font-size:12px;margin-top:8px;text-align:center}
.touch{display:none;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px;width:200px}
.touch button{padding:14px;font-size:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:#e6edf3}
.touch button:active{background:rgba(255,255,255,.15)}
.touch .sp{visibility:hidden}
@media(pointer:coarse){.touch{display:grid}.hint{display:none}}
</style>
</head>
<body>
<div class="top">
<div class="pill">Счёт: <b id="score">0</b></div>
<div class="pill">Рекорд: <b id="hiscore">0</b></div>
<div class="pill">Лучшая: <b id="best-tile">0</b></div>
</div>
<div class="btns">
<button onclick="gameInit()">Заново</button>
<button onclick="gameUndo()">Отмена</button>
</div>
<canvas id="c" width="400" height="400"></canvas>
<div class="hint">Свайп или ← ↑ → ↓ · R — заново</div>
<div class="touch">
<button class="sp"></button><button onclick="gameMove('up')">▲</button><button class="sp"></button>
<button onclick="gameMove('left')">◀</button><button class="sp"></button><button onclick="gameMove('right')">▶</button>
<button class="sp"></button><button onclick="gameMove('down')">▼</button><button class="sp"></button>
</div>
<script>
var SIZE=4,CELL=100,PAD=4;
var cv=document.getElementById("c"),cx=cv.getContext("2d");
var grid,score,bestTile,prevG,prevS,alive,won;
var TC={2:"#eee4da",4:"#ede0c8",8:"#f2b179",16:"#f59563",32:"#f67c5f",64:"#f65e3b",128:"#edcf72",256:"#edcc61",512:"#edc850",1024:"#edc53f",2048:"#edc22e"};
var TT={2:"#776e65",4:"#776e65",8:"#f9f6f2",16:"#f9f6f2",32:"#f9f6f2",64:"#f9f6f2",128:"#f9f6f2",256:"#f9f6f2",512:"#f9f6f2",1024:"#f9f6f2",2048:"#f9f6f2"};
var hi=0;try{hi=parseInt(localStorage.getItem("g2048_hi"))||0}catch(e){}

function addTile(){var e=[];for(var y=0;y<SIZE;y++)for(var x=0;x<SIZE;x++)if(grid[y][x]===0)e.push([x,y]);if(!e.length)return;var p=e[Math.floor(Math.random()*e.length)];grid[p[1]][p[0]]=Math.random()<0.9?2:4;}

function savePrev(){prevG=[];for(var y=0;y<SIZE;y++){prevG[y]=[];for(var x=0;x<SIZE;x++)prevG[y][x]=grid[y][x];}prevS=score;}

function merge(r){for(var i=0;i<SIZE-1;i++){if(r[i]&&r[i]===r[i+1]){r[i]*=2;score+=r[i];if(r[i]===2048)won=true;r[i+1]=0;}}return r;}
function comp(r){var a=r.filter(function(v){return v;});while(a.length<SIZE)a.push(0);return a;}
function slideL(r){return merge(comp(comp(r)));}

function doMove(dir){if(!alive)return;savePrev();var g=grid,ok=false;
if(dir==="left"){for(var y=0;y<SIZE;y++){var o=g[y].slice();g[y]=slideL(g[y].slice());if(o.join()!=g[y].join())ok=true;}}
else if(dir==="right"){for(var y=0;y<SIZE;y++){var o=g[y].slice();g[y]=slideL(g[y].slice()).reverse();if(o.join()!=g[y].join())ok=true;}}
else if(dir==="up"){var t=[];for(var x=0;x<SIZE;x++){t[x]=[];for(var y=0;y<SIZE;y++)t[x][y]=g[y][x];}var o2=[];for(var x=0;x<SIZE;x++)o2.push(t[x].slice());for(var x=0;x<SIZE;x++)t[x]=slideL(t[x]);for(var y=0;y<SIZE;y++)for(var x=0;x<SIZE;x++)g[y][x]=t[x][y];for(var x=0;x<SIZE;x++)if(o2[x].join()!=t[x].join())ok=true;}
else if(dir==="down"){var t=[];for(var x=0;x<SIZE;x++){t[x]=[];for(var y=0;y<SIZE;y++)t[x][y]=g[y][x];}var o3=[];for(var x=0;x<SIZE;x++)o3.push(t[x].slice());for(var x=0;x<SIZE;x++)t[x]=slideL(t[x]).reverse();for(var y=0;y<SIZE;y++)for(var x=0;x<SIZE;x++)g[y][x]=t[x][y];for(var x=0;x<SIZE;x++)if(o3[x].join()!=t[x].join())ok=true;}
if(ok){addTile();draw();updateUI();checkEnd();}}

function canMove(){for(var y=0;y<SIZE;y++)for(var x=0;x<SIZE;x++){if(!grid[y][x])return true;if(x<SIZE-1&&grid[y][x]===grid[y][x+1])return true;if(y<SIZE-1&&grid[y][x]===grid[y+1][x])return true;}return false;}

function checkEnd(){var mt=0;for(var y=0;y<SIZE;y++)for(var x=0;x<SIZE;x++)if(grid[y][x]>mt)mt=grid[y][x];
if(mt>bestTile)bestTile=mt;if(mt>hi){hi=mt;try{localStorage.setItem("g2048_hi",hi)}catch(e){}}
if(!canMove()){alive=false;setTimeout(function(){alert("Игра окончена! Счёт: "+score);},100);}
else if(won){won=false;setTimeout(function(){alert("2048! Счёт: "+score);},100);}}

function updateUI(){document.getElementById("score").textContent=score;document.getElementById("hiscore").textContent=hi;document.getElementById("best-tile").textContent=bestTile;}

function draw(){cx.fillStyle="#bbada0";cx.fillRect(0,0,cv.width,cv.height);
for(var y=0;y<SIZE;y++)for(var x=0;x<SIZE;x++){var px=PAD+x*CELL,py=PAD+y*CELL;
cx.fillStyle="#cdc1b4";cx.fillRect(px,py,CELL-PAD,CELL-PAD);
var v=grid[y][x];if(v){cx.fillStyle=TC[v]||"#3c3a32";cx.fillRect(px+1,py+1,CELL-PAD-2,CELL-PAD-2);
cx.fillStyle=TT[v]||"#f9f6f2";cx.font="bold "+(v>=1024?30:v>=100?34:42)+"px system-ui";cx.textAlign="center";cx.textBaseline="middle";cx.fillText(v+"",px+(CELL-PAD)/2,py+(CELL-PAD)/2);}}}

function gameInit(){grid=[];for(var y=0;y<SIZE;y++){grid[y]=[];for(var x=0;x<SIZE;x++)grid[y][x]=0;}
score=0;won=false;alive=true;prevG=null;prevS=0;bestTile=0;addTile();addTile();updateUI();draw();}

function gameUndo(){if(!prevG)return;grid=prevG;score=prevS;prevG=null;alive=true;won=false;updateUI();draw();}

window.addEventListener("keydown",function(e){var k=e.key;
if(k==="ArrowLeft"){e.preventDefault();doMove("left");}
else if(k==="ArrowRight"){e.preventDefault();doMove("right");}
else if(k==="ArrowUp"){e.preventDefault();doMove("up");}
else if(k==="ArrowDown"){e.preventDefault();doMove("down");}
else if(k.toLowerCase()==="r"){gameInit();}});

var tx=0,ty=0;
cv.addEventListener("touchstart",function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
cv.addEventListener("touchend",function(e){var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
if(Math.abs(dx)>Math.abs(dy)){doMove(dx>0?"right":"left");}else{doMove(dy>0?"down":"up");}},{passive:true});

gameInit();
</script>
</body>
</html>
