<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:system-ui,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.login-box{background:#16213e;border:1px solid #333;border-radius:10px;padding:32px;width:320px}
.login-box h2{text-align:center;margin-bottom:20px;font-size:18px;color:#fff}
.login-box label{display:block;margin-bottom:4px;font-size:13px;color:#aaa}
.login-box input{width:100%;padding:8px 10px;border:1px solid #3a3a3a;border-radius:6px;background:#0f3460;color:#e0e0e0;font-size:14px;margin-bottom:14px}
.login-box input:focus{border-color:#2563eb;outline:none}
.login-box button{width:100%;padding:9px;border:none;border-radius:6px;background:#2563eb;color:#fff;font-size:14px;cursor:pointer;margin-top:4px}
.login-box button:hover{background:#1d4ed8}
.error{background:#e74c3c20;border:1px solid #e74c3c;color:#e74c3c;padding:8px;border-radius:6px;margin-bottom:14px;font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="login-box">
<h2>LAN Discovery</h2>
{% if error %}
<div class="error">{{ error }}</div>
{% endif %}
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Пользователь</label>
<input type="text" name="username" autofocus required>
<label>Пароль</label>
<input type="password" name="password" required>
<button type="submit">Войти</button>
</form>
</div>
</body>
</html>
